name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build --compile --target=bun-windows-x64  --outfile dist/lcg-pair-windows.exe  src/pair.ts
          bun build --compile --target=bun-darwin-arm64 --outfile dist/lcg-pair-darwin-arm64 src/pair.ts
          bun build --compile --target=bun-darwin-x64   --outfile dist/lcg-pair-darwin-x64   src/pair.ts
          bun build --compile --target=bun-linux-x64    --outfile dist/lcg-pair-linux        src/pair.ts

      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum lcg-pair-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          built by [github actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from commit \`${GITHUB_SHA}\`, on a clean runner with a frozen lockfile.

          \`SHA256SUMS.txt\` is generated in that same run from the source at this tag — verify with \`sha256sum -c SHA256SUMS.txt\` (linux/mac) or \`Get-FileHash\` (windows).

          what it does: bridges in-game \`esc → pairing → enable\` to your lcg dashboard. it does NOT see your steam password — sign-in goes to steamcommunity.com's own login page and you get back a rust+ scoped token, the same one the official rust+ companion app uses.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
