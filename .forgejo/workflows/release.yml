name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-bookworm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build --compile --target=bun-windows-x64  --outfile dist/lcg-pair-windows.exe  src/pair.ts
          bun build --compile --target=bun-darwin-arm64 --outfile dist/lcg-pair-darwin-arm64 src/pair.ts
          bun build --compile --target=bun-darwin-x64   --outfile dist/lcg-pair-darwin-x64   src/pair.ts
          bun build --compile --target=bun-linux-x64    --outfile dist/lcg-pair-linux        src/pair.ts

      - name: checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum lcg-pair-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: publish
        env:
          # internal URL on purpose: Cloudflare caps request bodies at 100 MB and the
          # windows binary is ~109 MB, so uploading via git.fable.bz would 413
          API: http://forgejo:3000/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          AUTH="Authorization: token ${TOKEN}"

          cat > /tmp/body.md <<EOF
          built by [forgejo actions](https://git.fable.bz/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from commit \`${GITHUB_SHA}\`, on a clean runner with a frozen lockfile.

          \`SHA256SUMS.txt\` is generated in that same run from the source at this tag — verify with \`sha256sum -c SHA256SUMS.txt\` (linux/mac) or \`Get-FileHash\` (windows).

          what it does: bridges in-game \`esc → pairing → enable\` to your lcg dashboard. it does NOT see your steam password — sign-in goes to steamcommunity.com's own login page and you get back a rust+ scoped token, the same one the official rust+ companion app uses.
          EOF

          id=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(jq -n --arg t "$TAG" --rawfile b /tmp/body.md \
                  '{tag_name:$t,target_commitish:"main",name:$t,body:$b,draft:false,prerelease:false}' \
                 | curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' -d @- "$API/releases" \
                 | jq -r '.id')
            echo "created release $TAG (id $id)"
          else
            echo "reusing existing release $TAG (id $id)"
          fi

          for f in dist/*; do
            n=$(basename "$f")
            sz=$(curl -sf -X POST -H "$AUTH" -F "attachment=@${f}" "$API/releases/${id}/assets?name=${n}" | jq -r '.size')
            echo "uploaded ${n} (${sz} bytes)"
          done
